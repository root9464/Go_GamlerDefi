<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-neutral-950 text-gray-300 font-mono text-sm min-h-screen flex flex-col items-center p-4">
    <h1 class="text-lg text-gray-400 mb-4">WebRTC Video</h1>

    <div class="w-full max-w-md bg-neutral-900 p-3 rounded mb-4">
      <input
        type="text"
        id="roomId"
        placeholder="Room ID"
        class="w-full p-2 bg-neutral-800 text-gray-300 border border-neutral-700 rounded focus:outline-none focus:border-gray-500" />
      <input
        type="text"
        id="userId"
        placeholder="Your ID"
        class="w-full p-2 bg-neutral-800 text-gray-300 border border-neutral-700 rounded focus:outline-none focus:border-gray-500 mt-2" />
      <button id="joinRoom" class="mt-2 w-full p-2 bg-neutral-700 text-gray-200 rounded hover:bg-neutral-600 transition">Join</button>
    </div>

    <div class="w-full max-w-md flex flex-col gap-4">
      <div>
        <h3 class="text-sm text-gray-400">Local</h3>
        <video id="localVideo" width="320" height="240" autoplay muted class="bg-black rounded"></video>
      </div>
      <div>
        <h3 class="text-sm text-gray-400">Remote</h3>
        <div id="remoteVideos" class="flex flex-col gap-2"></div>
      </div>
    </div>

    <div class="w-full max-w-md mt-4">
      <h3 class="text-sm text-gray-400">Logs</h3>
      <div id="logs" class="p-2 bg-neutral-900 rounded max-h-40 overflow-y-auto"></div>
    </div>

    <script>
      let pc = null;
      let ws = null;
      let roomId = '';
      let userId = '';
      let localStream = null;
      const logElement = document.getElementById('logs');

      const participants = new Map(); // userId -> {el, user}
      const trackIdToUserId = new Map();
      const pendingStreams = new Map();

      function createPlaceholder(user) {
        const el = document.createElement('div');
        el.id = `participant-${user.UserID}`;
        el.className = 'remote-video-container flex flex-col items-center justify-center bg-neutral-800 rounded p-4 h-40';
        const avatar = document.createElement('div');
        avatar.className = 'w-16 h-16 rounded-full bg-neutral-700 flex items-center justify-center text-xl font-bold text-gray-300';
        const initials = (user.Username || user.UserID || '')
          .split(' ')
          .map((s) => s[0])
          .join('')
          .slice(0, 2)
          .toUpperCase();
        avatar.textContent = initials || '?';
        const name = document.createElement('div');
        name.className = 'text-gray-400 text-sm mt-2';
        name.textContent = user.Username || user.UserID;
        el.appendChild(avatar);
        el.appendChild(name);
        return el;
      }

      function createVideoElement(stream, user) {
        const container = document.createElement('div');
        container.className = 'remote-video-container flex flex-col items-center';
        const video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.controls = true;
        video.width = 320;
        video.height = 240;
        video.className = 'bg-black rounded';
        const label = document.createElement('div');
        label.className = 'text-gray-400 text-sm mt-1';
        label.textContent = user.Username || user.UserID;
        container.appendChild(video);
        container.appendChild(label);
        return container;
      }

      function renderParticipant(user) {
        if (user.UserID === userId) return; // не рендерим себя
        const container = document.getElementById('remoteVideos');
        if (!participants.has(user.UserID)) {
          let el = null;
          if (user.TrackID && pendingStreams.has(user.TrackID)) {
            el = createVideoElement(pendingStreams.get(user.TrackID), user);
            pendingStreams.delete(user.TrackID);
          } else {
            el = createPlaceholder(user);
          }
          participants.set(user.UserID, { el, user });
          container.appendChild(el);
        } else {
          const info = participants.get(user.UserID);
          info.user = user;
        }
      }

      function removeParticipant(user) {
        const info = participants.get(user.UserID);
        if (!info) return;
        const container = document.getElementById('remoteVideos');
        container.removeChild(info.el);
        participants.delete(user.UserID);
        for (const [k, v] of trackIdToUserId.entries()) {
          if (v === user.UserID) trackIdToUserId.delete(k);
        }
      }

      function attachStreamToUser(userID, stream, trackID) {
        if (userID === userId) return; // не прикрепляем свой стрим к себе
        const info = participants.get(userID);
        if (!info) {
          // сохраняем для будущей замены placeholder
          pendingStreams.set(trackID, stream);
          return;
        }
        const container = document.getElementById('remoteVideos');
        const videoEl = createVideoElement(stream, info.user);
        container.replaceChild(videoEl, info.el);
        participants.set(userID, { el: videoEl, user: info.user });

        // ====== DEBUG LOG: user_id <-> track_id ======
        console.log(`Attached track: user_id=${userID} <> track_id=${trackID}`);
        // ============================================
      }

      function log(message, type = 'info') {
        console.log(message);
        const logEntry = document.createElement('div');
        const timestamp = new Date().toLocaleTimeString();
        const colorClass = type === 'error' ? 'text-red-400' : type === 'success' ? 'text-green-400' : 'text-gray-400';
        logEntry.className = colorClass;
        logEntry.textContent = `[${timestamp}] ${message}`;
        logElement.prepend(logEntry);
      }

      document.getElementById('joinRoom').addEventListener('click', () => {
        const inputRoomId = document.getElementById('roomId').value.trim();
        const inputUserId = document.getElementById('userId').value.trim();
        if (inputRoomId && inputUserId) {
          roomId = inputRoomId;
          userId = inputUserId;
          log(`Joining room: ${roomId} with user ID: ${userId}`, 'success');
          initConnection();
        } else {
          log('Enter both room ID and user ID', 'error');
        }
      });

      function initPeerConnection() {
        if (pc) {
          try {
            pc.close();
          } catch (e) {}
          pc = null;
        }

        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

        pc.ontrack = function (event) {
          if (event.track.kind === 'audio') return;
          const stream = event.streams[0] || new MediaStream([event.track]);
          attachStreamToUser(trackIdToUserId.get(event.track.id), stream, event.track.id);
        };

        pc.oniceconnectionstatechange = () => {
          log(`ICE state: ${pc.iceConnectionState}`);
          if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
            log('Connection lost, reconnecting...', 'error');
            setTimeout(initConnection, 2000);
          }
        };

        pc.onicecandidate = (event) => {
          if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ event: 'candidate', data: JSON.stringify(event.candidate) }));
          }
        };

        return pc;
      }

      function setupWebSocket() {
        if (ws) {
          try {
            ws.close();
          } catch (e) {}
          ws = null;
        }

        const url = `ws://127.0.0.1:6069/api/session/ws/sales_courage/${encodeURIComponent(roomId)}/${encodeURIComponent(userId)}`;
        ws = new WebSocket(url);

        ws.onopen = () => {
          log(`WebSocket connected: ${roomId} as ${userId}`, 'success');
          ws.send(JSON.stringify({ event: 'request_offer', data: '' }));
        };

        ws.onmessage = (event) => {
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch (e) {
            log(`Parse error: ${e}`, 'error');
            return;
          }

          if (msg.event === 'participants') {
            const users = JSON.parse(msg.data);
            users.forEach((u) => {
              renderParticipant(u);
              if (u.TrackID) trackIdToUserId.set(u.TrackID, u.UserID);
            });
          } else if (msg.event === 'participant:updated') {
            const u = JSON.parse(msg.data);
            if (u.UserID !== userId) {
              renderParticipant(u);
              if (u.TrackID) {
                trackIdToUserId.set(u.TrackID, u.UserID);
                const pending = pendingStreams.get(u.TrackID);
                if (pending) attachStreamToUser(u.UserID, pending, u.TrackID);
              }
            }
          } else if (msg.event === 'participant:left') {
            removeParticipant(JSON.parse(msg.data));
          } else if (msg.event === 'offer') {
            const offer = JSON.parse(msg.data);
            pc.setRemoteDescription(new RTCSessionDescription(offer))
              .then(() => pc.createAnswer())
              .then((answer) => pc.setLocalDescription(answer))
              .then(() => ws.send(JSON.stringify({ event: 'answer', data: JSON.stringify(pc.localDescription) })));
          } else if (msg.event === 'candidate') {
            const candidate = JSON.parse(msg.data);
            pc.addIceCandidate(new RTCIceCandidate(candidate)).catch((e) => log(`ICE error: ${e}`, 'error'));
          }
        };
      }

      function initConnection() {
        document.getElementById('remoteVideos').innerHTML = '';
        participants.clear();
        trackIdToUserId.clear();
        pendingStreams.clear();

        initPeerConnection();
        setupWebSocket();

        navigator.mediaDevices
          .getUserMedia({ video: true, audio: true })
          .then((stream) => {
            localStream = stream;
            document.getElementById('localVideo').srcObject = stream;
            stream.getTracks().forEach((track) => pc.addTrack(track, stream));
          })
          .catch((error) => log(`Media error: ${error}`, 'error'));
      }
    </script>
  </body>
</html>
